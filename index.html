<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Rodzinna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #222;
            min-height: 100vh;
        }

        /* ===== EKRAN LOGOWANIA ===== */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: #fff;
        }
        .login-box {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .login-logo {
            max-width: 440px;
            width: 95%;
            height: auto;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #access-code {
            font-size: 1.4rem;
            letter-spacing: 6px;
            text-align: center;
            padding: 10px 12px;
            width: 180px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 0 auto 18px auto;
            display: block;
            outline: none;
            transition: border-color 0.2s;
        }
        #access-code:focus { border-color: #007bff; }
        #login-button {
            width: 180px;
            padding: 11px;
            font-size: 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            display: block;
            margin: 0 auto;
        }
        #login-button:hover { background: #0056b3; }
        #error-message {
            color: #dc3545;
            margin-top: 15px;
            font-size: 0.95rem;
            display: none;
        }

        /* ===== GŁÓWNA APLIKACJA ===== */
        #app {
            display: none;
            padding-bottom: 80px;
        }
        header {
            background: white;
            padding: 18px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            position: relative;
        }
        header .header-logo {
            height: 120px;
            width: auto;
            max-width: 92vw;
            display: block;
        }
        #logout-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 1px solid #ddd;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #555;
        }
        #logout-btn:hover { background: #f1f1f1; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .item {
            position: relative;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .item img, .item video {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #111;
        }
        .video-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .item-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .item:hover .item-actions { opacity: 1; }
        .action-btn {
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.65);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 15px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:hover { background: rgba(0,0,0,0.85); }
        .action-btn.download-btn:hover { background: #007bff; }
        .action-btn.delete-btn:hover { background: #dc3545; }

        /* Pusty stan */
        #empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
            display: none;
        }
        #empty-state p { font-size: 1.1rem; margin-top: 10px; }

        /* Przycisk + */
        #add-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 32px;
            line-height: 58px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,123,255,0.4);
            z-index: 200;
            transition: transform 0.2s, background 0.2s;
            display: none;
        }
        #add-btn:hover {
            background: #0056b3;
            transform: scale(1.08);
        }

        /* ===== MODAL PODGLĄDU ===== */
        #image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #image-modal.active { display: flex; }
        #modal-img, #modal-video {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            display: none;
        }
        #modal-img.active, #modal-video.active {
            display: block;
        }
        #modal-close {
            position: absolute;
            top: 20px;
            right: 28px;
            color: white;
            font-size: 42px;
            cursor: pointer;
            line-height: 1;
            opacity: 0.85;
        }
        #modal-close:hover { opacity: 1; }

        /* ===== MODAL UPLOAD ===== */
        #upload-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #upload-modal.active { display: flex; }
        .upload-box {
            background: white;
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 520px;
            position: relative;
        }
        .upload-box h2 {
            margin-bottom: 18px;
            font-size: 1.25rem;
            text-align: center;
        }
        .drop-zone {
            border: 2.5px dashed #bbb;
            border-radius: 14px;
            background: #fafafa;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            padding: 30px 20px;
            text-align: center;
        }
        .drop-zone.drag-over {
            border-color: #007bff;
            background: #eef5ff;
        }
        .drop-zone-icon {
            font-size: 48px;
            color: #aaa;
            line-height: 1;
        }
        .drop-zone-text {
            color: #666;
            font-size: 1rem;
        }
        .drop-zone-hint {
            color: #999;
            font-size: 0.85rem;
        }
        .drop-zone input[type="file"] {
            display: none;
        }
        #upload-status {
            margin-top: 16px;
            text-align: center;
            font-weight: 500;
            min-height: 24px;
        }
        .upload-close {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }
        .upload-close:hover { color: #333; }

        /* Loading */
        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <div class="login-box">
            <img class="login-logo" src="https://raw.githubusercontent.com/0-skar/fam/refs/heads/main/family.png" alt="Logo">
            <input type="password" id="access-code" placeholder="••••" maxlength="8" autocomplete="off">
            <button id="login-button">Wejdź</button>
            <p id="error-message">Nieprawidłowy kod dostępu</p>
        </div>
    </div>

    <!-- GŁÓWNA APLIKACJA -->
    <div id="app">
        <header>
            <img class="header-logo" src="https://raw.githubusercontent.com/0-skar/fam/refs/heads/main/family.png" alt="Logo">
            <button id="logout-btn">Wyloguj</button>
        </header>

        <div id="loading">Ładowanie zdjęć...</div>
        <div id="empty-state">
            <div style="font-size: 3rem;">📷</div>
            <p>Brak zdjęć i filmów w galerii.<br>Kliknij + aby dodać pierwsze.</p>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Przycisk dodawania -->
    <button id="add-btn" title="Dodaj zdjęcie">+</button>

    <!-- Modal podglądu zdjęcia -->
    <div id="image-modal">
        <span id="modal-close">&times;</span>
        <img id="modal-img" src="" alt="Podgląd">
        <video id="modal-video" controls playsinline></video>
    </div>

    <!-- Modal uploadu -->
    <div id="upload-modal">
        <div class="upload-box">
            <span class="upload-close" id="upload-close">&times;</span>
            <h2>Dodaj zdjęcie</h2>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-icon">📷</div>
                <div class="drop-zone-text">Upuść zdjęcie lub film tutaj</div>
                <div class="drop-zone-hint">lub kliknij, aby wybrać plik</div>
                <input type="file" id="image-file" accept="image/jpeg,image/png,image/gif,image/webp,image/jpg,video/mp4,video/webm,video/quicktime,video/*">
            </div>
            <div id="upload-status"></div>
        </div>
    </div>

<script>
    // ================== KONFIGURACJA ==================
    const BACKEND_URL = "https://eosforus-box.hf.space";   // <-- zmień jeśli masz inny Space
    const GALLERY_FOLDER = "family";                        // folder w Boxie, z którego korzysta galeria
    const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
    const VIDEO_EXTENSIONS = ['mp4', 'webm', 'mov', 'ogv', 'avi', 'mkv'];
    const MEDIA_EXTENSIONS = [...IMAGE_EXTENSIONS, ...VIDEO_EXTENSIONS];

    // ================== STAN ==================
    let sessionToken = null;

    // ================== ELEMENTY DOM ==================
    const loginScreen   = document.getElementById('login-screen');
    const app           = document.getElementById('app');
    const accessCode    = document.getElementById('access-code');
    const loginButton   = document.getElementById('login-button');
    const errorMessage  = document.getElementById('error-message');
    const galleryEl     = document.getElementById('gallery');
    const loadingEl     = document.getElementById('loading');
    const emptyState    = document.getElementById('empty-state');
    const addBtn        = document.getElementById('add-btn');
    const logoutBtn     = document.getElementById('logout-btn');

    const imageModal    = document.getElementById('image-modal');
    const modalImg      = document.getElementById('modal-img');
    const modalVideo    = document.getElementById('modal-video');
    const modalClose    = document.getElementById('modal-close');

    const uploadModal   = document.getElementById('upload-modal');
    const dropZone      = document.getElementById('drop-zone');
    const imageFile     = document.getElementById('image-file');
    const uploadStatus  = document.getElementById('upload-status');
    const uploadClose   = document.getElementById('upload-close');

    // ================== FUNKCJE ==================
    function getAuthHeaders() {
        return { 'Authorization': `Bearer ${sessionToken}` };
    }

    async function login() {
        const code = accessCode.value.trim();
        if (!code) return;

        loginButton.disabled = true;
        loginButton.textContent = "Sprawdzanie...";
        errorMessage.style.display = 'none';

        try {
            const res = await fetch(`${BACKEND_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });

            if (!res.ok) throw new Error("Błędny kod");

            const data = await res.json();
            sessionToken = data.access_token;

            // Zapamiętaj token na czas sesji przeglądarki
            sessionStorage.setItem('gallery_token', sessionToken);

            loginScreen.style.display = 'none';
            app.style.display = 'block';
            addBtn.style.display = 'block';
            loadGallery();
        } catch (err) {
            errorMessage.style.display = 'block';
            accessCode.value = '';
            accessCode.focus();
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Wejdź";
        }
    }

    function logout() {
        sessionToken = null;
        sessionStorage.removeItem('gallery_token');
        app.style.display = 'none';
        addBtn.style.display = 'none';
        loginScreen.style.display = 'flex';
        accessCode.value = '';
        galleryEl.innerHTML = '';
    }

    async function loadGallery() {
        loadingEl.style.display = 'block';
        emptyState.style.display = 'none';
        galleryEl.innerHTML = '';

        try {
            const res = await fetch(`${BACKEND_URL}/files`, {
                headers: getAuthHeaders()
            });
            if (!res.ok) throw new Error("Błąd autoryzacji");

            const data = await res.json();
            const files = data.files || [];

            // Filtrujemy zdjęcia i filmy z folderu family (bez podfolderów)
            const prefix = GALLERY_FOLDER + "/";
            const media = files.filter(f => {
                if (!f.startsWith(prefix)) return false;
                const relative = f.slice(prefix.length);
                if (relative.includes("/")) return false;
                const ext = relative.split(".").pop().toLowerCase();
                return MEDIA_EXTENSIONS.includes(ext);
            });

            loadingEl.style.display = 'none';

            if (media.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            media.reverse().forEach(path => {
                addMediaToGallery(path);
            });
        } catch (err) {
            loadingEl.style.display = 'none';
            alert("Nie udało się załadować galerii. Spróbuj odświeżyć stronę.");
            console.error(err);
        }
    }

    function isVideo(path) {
        const ext = path.split('.').pop().toLowerCase();
        return VIDEO_EXTENSIONS.includes(ext);
    }

    function addMediaToGallery(path) {
        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.path = path;

        const mediaUrl = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}&preview=true`;
        const downloadUrl = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}`;
        const video = isVideo(path);

        if (video) {
            item.innerHTML = `
                <div class="item-actions">
                    <button class="action-btn download-btn" title="Pobierz">⬇</button>
                    <button class="action-btn delete-btn" title="Usuń">×</button>
                </div>
                <video src="${mediaUrl}#t=0.5" muted preload="metadata" playsinline></video>
                <div class="video-badge">▶ FILM</div>
            `;
            item.querySelector('video').addEventListener('click', () => openMedia(path, true));
        } else {
            item.innerHTML = `
                <div class="item-actions">
                    <button class="action-btn download-btn" title="Pobierz">⬇</button>
                    <button class="action-btn delete-btn" title="Usuń">×</button>
                </div>
                <img src="${mediaUrl}" alt="${path}" loading="lazy">
            `;
            item.querySelector('img').addEventListener('click', () => openMedia(path, false));
        }

        item.querySelector('.download-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = path.split('/').pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        item.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteImage(path, item);
        });

        galleryEl.prepend(item);
    }

    function openMedia(path, video) {
        const url = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}&preview=true`;
        modalImg.classList.remove('active');
        modalVideo.classList.remove('active');
        modalVideo.pause();
        modalVideo.removeAttribute('src');

        if (video) {
            modalVideo.src = url;
            modalVideo.classList.add('active');
            modalVideo.play().catch(() => {});
        } else {
            modalImg.src = url;
            modalImg.classList.add('active');
        }
        imageModal.classList.add('active');
    }

    async function deleteImage(path, element) {
        if (!confirm("Czy na pewno chcesz usunąć to zdjęcie?")) return;

        element.style.opacity = '0.4';

        try {
            const res = await fetch(`${BACKEND_URL}/delete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({ path })
            });

            if (res.ok) {
                element.style.transform = 'scale(0.8)';
                element.style.opacity = '0';
                setTimeout(() => {
                    element.remove();
                    if (galleryEl.children.length === 0) {
                        emptyState.style.display = 'block';
                    }
                }, 250);
            } else {
                alert("Nie udało się usunąć zdjęcia.");
                element.style.opacity = '1';
            }
        } catch (err) {
            alert("Błąd połączenia.");
            element.style.opacity = '1';
        }
    }

    // ================== UPLOAD ==================
    async function uploadFile(file) {
        if (!file) return;

        uploadStatus.textContent = "Przesyłanie...";
        uploadStatus.style.color = "#333";
        dropZone.style.pointerEvents = "none";
        dropZone.style.opacity = "0.6";

        const formData = new FormData();
        formData.append('file', file);
        formData.append('path', GALLERY_FOLDER);

        try {
            const res = await fetch(`${BACKEND_URL}/upload`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: formData
            });

            const data = await res.json();

            if (res.ok) {
                uploadStatus.textContent = "Dodano!";
                uploadStatus.style.color = "green";
                setTimeout(() => {
                    closeUploadModal();
                    loadGallery();
                }, 800);
            } else {
                uploadStatus.textContent = data.detail || "Błąd przesyłania";
                uploadStatus.style.color = "red";
            }
        } catch (err) {
            uploadStatus.textContent = "Błąd połączenia z serwerem";
            uploadStatus.style.color = "red";
        } finally {
            dropZone.style.pointerEvents = "";
            dropZone.style.opacity = "1";
        }
    }

    function openUploadModal() {
        uploadModal.classList.add('active');
        uploadStatus.textContent = '';
        imageFile.value = '';
    }
    function closeUploadModal() {
        uploadModal.classList.remove('active');
    }

    // Kliknięcie w ramkę → wybór pliku
    dropZone.addEventListener('click', () => imageFile.click());

    // Wybranie pliku z dysku
    imageFile.addEventListener('change', () => {
        if (imageFile.files[0]) uploadFile(imageFile.files[0]);
    });

    // Drag & drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && (file.type.startsWith('image/') || file.type.startsWith('video/'))) {
            uploadFile(file);
        } else {
            uploadStatus.textContent = "Wybierz zdjęcie lub film";
            uploadStatus.style.color = "red";
        }
    });

    // ================== EVENTY ==================
    loginButton.addEventListener('click', login);
    accessCode.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') login();
    });

    logoutBtn.addEventListener('click', logout);
    addBtn.addEventListener('click', openUploadModal);
    uploadClose.addEventListener('click', closeUploadModal);

    function closeMediaModal() {
        imageModal.classList.remove('active');
        modalImg.src = '';
        modalImg.classList.remove('active');
        modalVideo.pause();
        modalVideo.removeAttribute('src');
        modalVideo.classList.remove('active');
    }
    modalClose.addEventListener('click', closeMediaModal);
    imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal) closeMediaModal();
    });

    // Zamknięcie upload modal kliknięciem w tło
    uploadModal.addEventListener('click', (e) => {
        if (e.target === uploadModal) closeUploadModal();
    });

    // ================== START ==================
    // Sprawdź czy jest zapisany token (odświeżenie strony)
    const savedToken = sessionStorage.getItem('gallery_token');
    if (savedToken) {
        sessionToken = savedToken;
        loginScreen.style.display = 'none';
        app.style.display = 'block';
        addBtn.style.display = 'block';
        loadGallery();
    } else {
        addBtn.style.display = 'none';
        accessCode.focus();
    }
</script>
</body>
</html>

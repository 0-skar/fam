<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Rodzinna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #222;
            min-height: 100vh;
        }

        /* ===== EKRAN LOGOWANIA ===== */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: #fff;
        }
        .login-box {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .login-box h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .login-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        #access-code {
            font-size: 1.8rem;
            letter-spacing: 8px;
            text-align: center;
            padding: 14px;
            width: 100%;
            border: 2px solid #ddd;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }
        #access-code:focus { border-color: #007bff; }
        #login-button {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        #login-button:hover { background: #0056b3; }
        #error-message {
            color: #dc3545;
            margin-top: 15px;
            font-size: 0.95rem;
            display: none;
        }

        /* ===== GŁÓWNA APLIKACJA ===== */
        #app {
            display: none;
            padding-bottom: 80px;
        }
        header {
            background: white;
            padding: 18px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }
        #logout-btn {
            background: transparent;
            border: 1px solid #ddd;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #555;
        }
        #logout-btn:hover { background: #f1f1f1; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .item {
            position: relative;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .item img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.65);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #dc3545; }

        /* Pusty stan */
        #empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
            display: none;
        }
        #empty-state p { font-size: 1.1rem; margin-top: 10px; }

        /* Przycisk + */
        #add-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 32px;
            line-height: 58px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,123,255,0.4);
            z-index: 200;
            transition: transform 0.2s, background 0.2s;
            display: none;
        }
        #add-btn:hover {
            background: #0056b3;
            transform: scale(1.08);
        }

        /* ===== MODAL PODGLĄDU ===== */
        #image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #image-modal.active { display: flex; }
        #modal-img {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }
        #modal-close {
            position: absolute;
            top: 20px;
            right: 28px;
            color: white;
            font-size: 42px;
            cursor: pointer;
            line-height: 1;
            opacity: 0.85;
        }
        #modal-close:hover { opacity: 1; }

        /* ===== MODAL UPLOAD ===== */
        #upload-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #upload-modal.active { display: flex; }
        .upload-box {
            background: white;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .upload-box h2 {
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .upload-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .upload-box input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        #upload-submit {
            width: 100%;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
        }
        #upload-submit:hover { background: #0056b3; }
        #upload-submit:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        #upload-status {
            margin-top: 14px;
            text-align: center;
            font-weight: 500;
            min-height: 24px;
        }
        .upload-close {
            position: absolute;
            top: 16px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }
        .upload-close:hover { color: #333; }

        /* Loading */
        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Galeria Rodzinna</h1>
            <p>Wprowadź kod dostępu, aby wejść</p>
            <input type="password" id="access-code" placeholder="••••" maxlength="8" autocomplete="off">
            <button id="login-button">Wejdź</button>
            <p id="error-message">Nieprawidłowy kod dostępu</p>
        </div>
    </div>

    <!-- GŁÓWNA APLIKACJA -->
    <div id="app">
        <header>
            <h1>Galeria Rodzinna</h1>
            <button id="logout-btn">Wyloguj</button>
        </header>

        <div id="loading">Ładowanie zdjęć...</div>
        <div id="empty-state">
            <div style="font-size: 3rem;">📷</div>
            <p>Brak zdjęć w galerii.<br>Kliknij + aby dodać pierwsze.</p>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Przycisk dodawania -->
    <button id="add-btn" title="Dodaj zdjęcie">+</button>

    <!-- Modal podglądu zdjęcia -->
    <div id="image-modal">
        <span id="modal-close">&times;</span>
        <img id="modal-img" src="" alt="Podgląd">
    </div>

    <!-- Modal uploadu -->
    <div id="upload-modal">
        <div class="upload-box">
            <span class="upload-close" id="upload-close">&times;</span>
            <h2>Dodaj zdjęcie</h2>
            <form id="upload-form">
                <label for="image-file">Wybierz zdjęcie</label>
                <input type="file" id="image-file" accept="image/jpeg,image/png,image/gif,image/webp,image/jpg" required>
                <button type="submit" id="upload-submit">Wyślij</button>
            </form>
            <div id="upload-status"></div>
        </div>
    </div>

<script>
    // ================== KONFIGURACJA ==================
    const BACKEND_URL = "https://eosforus-box.hf.space";   // <-- zmień jeśli masz inny Space
    const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];

    // ================== STAN ==================
    let sessionToken = null;

    // ================== ELEMENTY DOM ==================
    const loginScreen   = document.getElementById('login-screen');
    const app           = document.getElementById('app');
    const accessCode    = document.getElementById('access-code');
    const loginButton   = document.getElementById('login-button');
    const errorMessage  = document.getElementById('error-message');
    const galleryEl     = document.getElementById('gallery');
    const loadingEl     = document.getElementById('loading');
    const emptyState    = document.getElementById('empty-state');
    const addBtn        = document.getElementById('add-btn');
    const logoutBtn     = document.getElementById('logout-btn');

    const imageModal    = document.getElementById('image-modal');
    const modalImg      = document.getElementById('modal-img');
    const modalClose    = document.getElementById('modal-close');

    const uploadModal   = document.getElementById('upload-modal');
    const uploadForm    = document.getElementById('upload-form');
    const imageFile     = document.getElementById('image-file');
    const uploadSubmit  = document.getElementById('upload-submit');
    const uploadStatus  = document.getElementById('upload-status');
    const uploadClose   = document.getElementById('upload-close');

    // ================== FUNKCJE ==================
    function getAuthHeaders() {
        return { 'Authorization': `Bearer ${sessionToken}` };
    }

    async function login() {
        const code = accessCode.value.trim();
        if (!code) return;

        loginButton.disabled = true;
        loginButton.textContent = "Sprawdzanie...";
        errorMessage.style.display = 'none';

        try {
            const res = await fetch(`${BACKEND_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });

            if (!res.ok) throw new Error("Błędny kod");

            const data = await res.json();
            sessionToken = data.access_token;

            // Zapamiętaj token na czas sesji przeglądarki
            sessionStorage.setItem('gallery_token', sessionToken);

            loginScreen.style.display = 'none';
            app.style.display = 'block';
            addBtn.style.display = 'block';
            loadGallery();
        } catch (err) {
            errorMessage.style.display = 'block';
            accessCode.value = '';
            accessCode.focus();
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Wejdź";
        }
    }

    function logout() {
        sessionToken = null;
        sessionStorage.removeItem('gallery_token');
        app.style.display = 'none';
        addBtn.style.display = 'none';
        loginScreen.style.display = 'flex';
        accessCode.value = '';
        galleryEl.innerHTML = '';
    }

    async function loadGallery() {
        loadingEl.style.display = 'block';
        emptyState.style.display = 'none';
        galleryEl.innerHTML = '';

        try {
            const res = await fetch(`${BACKEND_URL}/files`, {
                headers: getAuthHeaders()
            });
            if (!res.ok) throw new Error("Błąd autoryzacji");

            const data = await res.json();
            const files = data.files || [];

            // Filtrujemy tylko obrazy
            const images = files.filter(f => {
                const ext = f.split('.').pop().toLowerCase();
                return IMAGE_EXTENSIONS.includes(ext) && !f.includes('/');
            });

            loadingEl.style.display = 'none';

            if (images.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            // Sortujemy od najnowszych
            images.reverse().forEach(path => {
                addImageToGallery(path);
            });
        } catch (err) {
            loadingEl.style.display = 'none';
            alert("Nie udało się załadować galerii. Spróbuj odświeżyć stronę.");
            console.error(err);
        }
    }

    function addImageToGallery(path) {
        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.path = path;

        // URL do podglądu (z tokenem)
        const imgUrl = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}&preview=true`;

        item.innerHTML = `
            <button class="delete-btn" title="Usuń">×</button>
            <img src="${imgUrl}" alt="${path}" loading="lazy">
        `;

        // Podgląd
        item.querySelector('img').addEventListener('click', () => {
            modalImg.src = imgUrl;
            imageModal.classList.add('active');
        });

        // Usuwanie
        item.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteImage(path, item);
        });

        galleryEl.prepend(item);
    }

    async function deleteImage(path, element) {
        if (!confirm("Czy na pewno chcesz usunąć to zdjęcie?")) return;

        element.style.opacity = '0.4';

        try {
            const res = await fetch(`${BACKEND_URL}/delete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({ path })
            });

            if (res.ok) {
                element.style.transform = 'scale(0.8)';
                element.style.opacity = '0';
                setTimeout(() => {
                    element.remove();
                    if (galleryEl.children.length === 0) {
                        emptyState.style.display = 'block';
                    }
                }, 250);
            } else {
                alert("Nie udało się usunąć zdjęcia.");
                element.style.opacity = '1';
            }
        } catch (err) {
            alert("Błąd połączenia.");
            element.style.opacity = '1';
        }
    }

    // ================== UPLOAD ==================
    uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = imageFile.files[0];
        if (!file) return;

        uploadSubmit.disabled = true;
        uploadStatus.textContent = "Przesyłanie...";
        uploadStatus.style.color = "#333";

        const formData = new FormData();
        formData.append('file', file);
        formData.append('path', '');          // root galerii

        try {
            const res = await fetch(`${BACKEND_URL}/upload`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: formData
            });

            const data = await res.json();

            if (res.ok) {
                uploadStatus.textContent = "Dodano!";
                uploadStatus.style.color = "green";

                // Odświeżamy listę po krótkiej chwili
                setTimeout(() => {
                    closeUploadModal();
                    loadGallery();
                }, 900);
            } else {
                uploadStatus.textContent = data.detail || "Błąd przesyłania";
                uploadStatus.style.color = "red";
            }
        } catch (err) {
            uploadStatus.textContent = "Błąd połączenia z serwerem";
            uploadStatus.style.color = "red";
        } finally {
            uploadSubmit.disabled = false;
        }
    });

    function openUploadModal() {
        uploadModal.classList.add('active');
        uploadStatus.textContent = '';
        uploadForm.reset();
    }
    function closeUploadModal() {
        uploadModal.classList.remove('active');
    }

    // ================== EVENTY ==================
    loginButton.addEventListener('click', login);
    accessCode.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') login();
    });

    logoutBtn.addEventListener('click', logout);
    addBtn.addEventListener('click', openUploadModal);
    uploadClose.addEventListener('click', closeUploadModal);

    modalClose.addEventListener('click', () => {
        imageModal.classList.remove('active');
        modalImg.src = '';
    });
    imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal) {
            imageModal.classList.remove('active');
            modalImg.src = '';
        }
    });

    // Zamknięcie upload modal kliknięciem w tło
    uploadModal.addEventListener('click', (e) => {
        if (e.target === uploadModal) closeUploadModal();
    });

    // ================== START ==================
    // Sprawdź czy jest zapisany token (odświeżenie strony)
    const savedToken = sessionStorage.getItem('gallery_token');
    if (savedToken) {
        sessionToken = savedToken;
        loginScreen.style.display = 'none';
        app.style.display = 'block';
        addBtn.style.display = 'block';
        loadGallery();
    } else {
        addBtn.style.display = 'none';
        accessCode.focus();
    }
</script>
</body>
</html>

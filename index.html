<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Rodzinna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #222;
            min-height: 100vh;
        }

        /* ===== EKRAN LOGOWANIA ===== */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: #fff;
        }
        .login-box {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .login-logo {
            max-width: 440px;
            width: 95%;
            height: auto;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #access-code {
            font-size: 1.4rem;
            letter-spacing: 6px;
            text-align: center;
            padding: 10px 12px;
            width: 180px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 0 auto 18px auto;
            display: block;
            outline: none;
            transition: border-color 0.2s;
        }
        #access-code:focus { border-color: #007bff; }
        #login-button {
            width: 180px;
            padding: 11px;
            font-size: 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            display: block;
            margin: 0 auto;
        }
        #login-button:hover { background: #0056b3; }
        #error-message {
            color: #dc3545;
            margin-top: 15px;
            font-size: 0.95rem;
            display: none;
        }

        /* ===== GŁÓWNA APLIKACJA ===== */
        #app {
            display: none;
            padding-bottom: 80px;
        }
        header {
            background: white;
            padding: 18px 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            position: relative;
        }
        header .header-logo {
            height: 120px;
            width: auto;
            max-width: 92vw;
            display: block;
        }
        #logout-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 1px solid #ddd;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #555;
        }
        #logout-btn:hover { background: #f1f1f1; }

        .gallery {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .month-section {
            margin-bottom: 36px;
        }
        .month-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .item {
            position: relative;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .item img, .item video {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #111;
        }
        .video-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            pointer-events: none;
            letter-spacing: 0.3px;
        }
        .item-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .item:hover .item-actions { opacity: 1; }
        .action-btn {
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.65);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 15px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:hover { background: rgba(0,0,0,0.85); }
        .action-btn.share-btn:hover { background: #28a745; }
        .action-btn.download-btn:hover { background: #007bff; }
        .action-btn.delete-btn:hover { background: #dc3545; }

        /* ===== MODAL UDOSTĘPNIANIA ===== */
        #share-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #share-modal.active { display: flex; }
        .share-box {
            background: white;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            position: relative;
        }
        .share-box h2 {
            margin-bottom: 6px;
            font-size: 1.25rem;
        }
        .share-filename {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 22px;
            word-break: break-all;
        }
        .share-form-group {
            margin-bottom: 16px;
        }
        .share-form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .share-controls {
            display: flex;
            gap: 10px;
        }
        .share-controls input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .share-controls select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }
        #generate-share-btn {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }
        #generate-share-btn:hover { background: #218838; }
        #generate-share-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .share-result {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 16px;
            display: none;
        }
        .share-result.active { display: block; }
        .copy-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .copy-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.85rem;
            background: #f9f9f9;
            font-family: monospace;
        }
        .copy-btn {
            padding: 0 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        .copy-btn:hover { background: #0056b3; }
        .share-close {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }
        .share-close:hover { color: #333; }

        /* Pusty stan */
        #empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #888;
            display: none;
        }
        #empty-state p { font-size: 1.1rem; margin-top: 10px; }

        /* Przycisk + */
        #add-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 32px;
            line-height: 58px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,123,255,0.4);
            z-index: 200;
            transition: transform 0.2s, background 0.2s;
            display: none;
        }
        #add-btn:hover {
            background: #0056b3;
            transform: scale(1.08);
        }

        /* ===== MODAL PODGLĄDU ===== */
        #image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #image-modal.active { display: flex; }
        #modal-img, #modal-video {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            display: none;
        }
        #modal-img.active, #modal-video.active {
            display: block;
        }
        #modal-close {
            position: absolute;
            top: 20px;
            right: 28px;
            color: white;
            font-size: 42px;
            cursor: pointer;
            line-height: 1;
            opacity: 0.85;
        }
        #modal-close:hover { opacity: 1; }

        /* ===== MODAL UPLOAD ===== */
        #upload-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #upload-modal.active { display: flex; }
        .upload-box {
            background: white;
            border-radius: 18px;
            padding: 24px;
            width: 100%;
            max-width: 520px;
            position: relative;
        }
        .upload-box h2 {
            margin-bottom: 18px;
            font-size: 1.25rem;
            text-align: center;
        }
        .drop-zone {
            border: 2.5px dashed #bbb;
            border-radius: 14px;
            background: #fafafa;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            padding: 30px 20px;
            text-align: center;
        }
        .drop-zone.drag-over {
            border-color: #007bff;
            background: #eef5ff;
        }
        .drop-zone-icon {
            font-size: 48px;
            color: #aaa;
            line-height: 1;
        }
        .drop-zone-text {
            color: #666;
            font-size: 1rem;
        }
        .drop-zone-hint {
            color: #999;
            font-size: 0.85rem;
        }
        .drop-zone input[type="file"] {
            display: none;
        }
        #upload-status {
            margin-top: 16px;
            text-align: center;
            font-weight: 500;
            min-height: 24px;
        }
        .upload-close {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            line-height: 1;
        }
        .upload-close:hover { color: #333; }

        /* Loading */
        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <div class="login-box">
            <img class="login-logo" src="https://raw.githubusercontent.com/0-skar/fam/refs/heads/main/family.png" alt="Logo">
            <input type="password" id="access-code" placeholder="••••" maxlength="8" autocomplete="off">
            <button id="login-button">Wejdź</button>
            <p id="error-message">Nieprawidłowy kod dostępu</p>
        </div>
    </div>

    <!-- GŁÓWNA APLIKACJA -->
    <div id="app">
        <header>
            <img class="header-logo" src="https://raw.githubusercontent.com/0-skar/fam/refs/heads/main/family.png" alt="Logo">
            <button id="logout-btn">Wyloguj</button>
        </header>

        <div id="loading">Ładowanie zdjęć...</div>
        <div id="empty-state">
            <div style="font-size: 3rem;">📷</div>
            <p>Brak zdjęć i filmów w galerii.<br>Kliknij + aby dodać pierwsze.</p>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Przycisk dodawania -->
    <button id="add-btn" title="Dodaj zdjęcie">+</button>

    <!-- Modal podglądu zdjęcia -->
    <div id="image-modal">
        <span id="modal-close">&times;</span>
        <img id="modal-img" src="" alt="Podgląd">
        <video id="modal-video" controls playsinline></video>
    </div>

    <!-- Modal uploadu -->
    <div id="upload-modal">
        <div class="upload-box">
            <span class="upload-close" id="upload-close">&times;</span>
            <h2>Dodaj zdjęcia / filmy</h2>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-icon">📷</div>
                <div class="drop-zone-text">Upuść zdjęcia lub filmy tutaj</div>
                <div class="drop-zone-hint">możesz wybrać wiele plików naraz</div>
                <input type="file" id="image-file" accept="image/jpeg,image/png,image/gif,image/webp,image/jpg,video/mp4,video/webm,video/quicktime,video/*" multiple>
            </div>
            <div id="upload-status"></div>
        </div>
    </div>

    <!-- Modal udostępniania -->
    <div id="share-modal">
        <div class="share-box">
            <span class="share-close" id="share-close">&times;</span>
            <h2>Udostępnij</h2>
            <div class="share-filename" id="share-filename"></div>

            <div class="share-form-group">
                <label>Czas ważności linku:</label>
                <div class="share-controls">
                    <input type="number" id="share-expires-value" value="1" min="1">
                    <select id="share-expires-unit">
                        <option value="minutes">Minuty</option>
                        <option value="hours">Godziny</option>
                        <option value="days" selected>Dni</option>
                        <option value="years">Lata</option>
                        <option value="never">Bez limitu</option>
                    </select>
                </div>
            </div>

            <button id="generate-share-btn">Generuj link</button>

            <div class="share-result" id="share-result">
                <div class="share-form-group">
                    <label>Link do udostępnienia:</label>
                    <div class="copy-group">
                        <input type="text" id="share-link" readonly>
                        <button class="copy-btn" id="copy-share-btn">Kopiuj</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script>
    // ================== KONFIGURACJA ==================
    const BACKEND_URL = "https://eosforus-box.hf.space";   // <-- zmień jeśli masz inny Space
    const GALLERY_FOLDER = "family";                        // folder w Boxie, z którego korzysta galeria
    const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
    const VIDEO_EXTENSIONS = ['mp4', 'webm', 'mov', 'ogv', 'avi', 'mkv'];
    const MEDIA_EXTENSIONS = [...IMAGE_EXTENSIONS, ...VIDEO_EXTENSIONS];

    // ================== STAN ==================
    let sessionToken = null;
    let fileToShare = null;

    // ================== ELEMENTY DOM ==================
    const loginScreen   = document.getElementById('login-screen');
    const app           = document.getElementById('app');
    const accessCode    = document.getElementById('access-code');
    const loginButton   = document.getElementById('login-button');
    const errorMessage  = document.getElementById('error-message');
    const galleryEl     = document.getElementById('gallery');
    const loadingEl     = document.getElementById('loading');
    const emptyState    = document.getElementById('empty-state');
    const addBtn        = document.getElementById('add-btn');
    const logoutBtn     = document.getElementById('logout-btn');

    const imageModal    = document.getElementById('image-modal');
    const modalImg      = document.getElementById('modal-img');
    const modalVideo    = document.getElementById('modal-video');
    const modalClose    = document.getElementById('modal-close');

    const uploadModal   = document.getElementById('upload-modal');
    const dropZone      = document.getElementById('drop-zone');
    const imageFile     = document.getElementById('image-file');
    const uploadStatus  = document.getElementById('upload-status');
    const uploadClose   = document.getElementById('upload-close');

    const shareModal        = document.getElementById('share-modal');
    const shareClose        = document.getElementById('share-close');
    const shareFilename     = document.getElementById('share-filename');
    const shareExpiresValue = document.getElementById('share-expires-value');
    const shareExpiresUnit  = document.getElementById('share-expires-unit');
    const generateShareBtn  = document.getElementById('generate-share-btn');
    const shareResult       = document.getElementById('share-result');
    const shareLinkInput    = document.getElementById('share-link');
    const copyShareBtn      = document.getElementById('copy-share-btn');

    // ================== FUNKCJE ==================
    function getAuthHeaders() {
        return { 'Authorization': `Bearer ${sessionToken}` };
    }

    async function login() {
        const code = accessCode.value.trim();
        if (!code) return;

        loginButton.disabled = true;
        loginButton.textContent = "Sprawdzanie...";
        errorMessage.style.display = 'none';

        try {
            const res = await fetch(`${BACKEND_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });

            if (!res.ok) throw new Error("Błędny kod");

            const data = await res.json();
            sessionToken = data.access_token;

            // Zapamiętaj token na czas sesji przeglądarki
            sessionStorage.setItem('gallery_token', sessionToken);

            loginScreen.style.display = 'none';
            app.style.display = 'block';
            addBtn.style.display = 'block';
            loadGallery();
        } catch (err) {
            errorMessage.style.display = 'block';
            accessCode.value = '';
            accessCode.focus();
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Wejdź";
        }
    }

    function logout() {
        sessionToken = null;
        sessionStorage.removeItem('gallery_token');
        app.style.display = 'none';
        addBtn.style.display = 'none';
        loginScreen.style.display = 'flex';
        accessCode.value = '';
        galleryEl.innerHTML = '';
    }

    const MONTH_NAMES_PL = [
        'Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec',
        'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'
    ];

    // Wyciąga datę z nazwy pliku (prefix YYYY-MM-DD... lub YYYYMMDD)
    function extractDateFromPath(path) {
        const name = path.split('/').pop();
        // 2026-09-12T10-23-45_nazwa.jpg  lub  2026-09-12_nazwa.jpg
        let m = name.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
        // 20260912_nazwa.jpg
        m = name.match(/^(\d{4})(\d{2})(\d{2})/);
        if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
        return null;
    }

    function monthKey(date) {
        if (!date) return '9999-99';
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function monthLabel(key) {
        if (key === '9999-99') return 'Bez daty';
        const [y, m] = key.split('-');
        return `${MONTH_NAMES_PL[+m - 1]} ${y}`;
    }

    async function loadGallery() {
        loadingEl.style.display = 'block';
        emptyState.style.display = 'none';
        galleryEl.innerHTML = '';

        try {
            const res = await fetch(`${BACKEND_URL}/files`, {
                headers: getAuthHeaders()
            });
            if (!res.ok) throw new Error("Błąd autoryzacji");

            const data = await res.json();
            const files = data.files || [];

            // Filtrujemy zdjęcia i filmy z folderu family (bez podfolderów)
            const prefix = GALLERY_FOLDER + "/";
            const media = files.filter(f => {
                if (!f.startsWith(prefix)) return false;
                const relative = f.slice(prefix.length);
                if (relative.includes("/")) return false;
                const ext = relative.split(".").pop().toLowerCase();
                return MEDIA_EXTENSIONS.includes(ext);
            });

            loadingEl.style.display = 'none';

            if (media.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            // Grupowanie po miesiącach
            const groups = {};
            media.forEach(path => {
                const date = extractDateFromPath(path);
                const key = monthKey(date);
                if (!groups[key]) groups[key] = [];
                groups[key].push({ path, date: date ? date.getTime() : 0 });
            });

            // Sortowanie miesięcy: najnowsze pierwsze
            const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

            sortedKeys.forEach(key => {
                // W miesiącu: od najnowszych
                groups[key].sort((a, b) => b.date - a.date);

                const section = document.createElement('div');
                section.className = 'month-section';

                const title = document.createElement('div');
                title.className = 'month-title';
                title.textContent = monthLabel(key);
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'month-grid';
                section.appendChild(grid);

                galleryEl.appendChild(section);

                groups[key].forEach(({ path }) => {
                    addMediaToGallery(path, grid);
                });
            });
        } catch (err) {
            loadingEl.style.display = 'none';
            alert("Nie udało się załadować galerii. Spróbuj odświeżyć stronę.");
            console.error(err);
        }
    }

    function isVideo(path) {
        const ext = path.split('.').pop().toLowerCase();
        return VIDEO_EXTENSIONS.includes(ext);
    }

    function addMediaToGallery(path, container) {
        const parent = container || galleryEl;
        const item = document.createElement('div');
        item.className = 'item';
        item.dataset.path = path;

        const mediaUrl = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}&preview=true`;
        const downloadUrl = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}`;
        const video = isVideo(path);

        const actionsHtml = `
            <div class="item-actions">
                <button class="action-btn share-btn" title="Udostępnij">🔗</button>
                <button class="action-btn download-btn" title="Pobierz">⬇</button>
                <button class="action-btn delete-btn" title="Usuń">×</button>
            </div>
        `;

        if (video) {
            item.innerHTML = `
                ${actionsHtml}
                <video src="${mediaUrl}#t=0.5" muted preload="metadata" playsinline></video>
                <div class="video-badge">▶ FILM</div>
            `;
            item.querySelector('video').addEventListener('click', () => openMedia(path, true));
        } else {
            item.innerHTML = `
                ${actionsHtml}
                <img src="${mediaUrl}" alt="${path}" loading="lazy">
            `;
            item.querySelector('img').addEventListener('click', () => openMedia(path, false));
        }

        item.querySelector('.share-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            openShareModal(path);
        });

        item.querySelector('.download-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = path.split('/').pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        item.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteImage(path, item);
        });

        parent.appendChild(item);
    }

    function openShareModal(path) {
        fileToShare = path;
        shareFilename.textContent = path.split('/').pop();
        shareResult.classList.remove('active');
        shareLinkInput.value = '';
        shareExpiresValue.value = 1;
        shareExpiresUnit.value = 'days';
        shareExpiresValue.disabled = false;
        shareModal.classList.add('active');
    }

    function closeShareModal() {
        shareModal.classList.remove('active');
        fileToShare = null;
    }

    function openMedia(path, video) {
        const url = `${BACKEND_URL}/download/${encodeURIComponent(path)}?token=${sessionToken}&preview=true`;
        modalImg.classList.remove('active');
        modalVideo.classList.remove('active');
        modalVideo.pause();
        modalVideo.removeAttribute('src');

        if (video) {
            modalVideo.src = url;
            modalVideo.classList.add('active');
            modalVideo.play().catch(() => {});
        } else {
            modalImg.src = url;
            modalImg.classList.add('active');
        }
        imageModal.classList.add('active');
    }

    async function deleteImage(path, element) {
        if (!confirm("Czy na pewno chcesz usunąć to zdjęcie?")) return;

        element.style.opacity = '0.4';

        try {
            const res = await fetch(`${BACKEND_URL}/delete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({ path })
            });

            if (res.ok) {
                element.style.transform = 'scale(0.8)';
                element.style.opacity = '0';
                setTimeout(() => {
                    const section = element.closest('.month-section');
                    element.remove();
                    if (section) {
                        const grid = section.querySelector('.month-grid');
                        if (grid && grid.children.length === 0) section.remove();
                    }
                    if (galleryEl.children.length === 0) {
                        emptyState.style.display = 'block';
                    }
                }, 250);
            } else {
                alert("Nie udało się usunąć zdjęcia.");
                element.style.opacity = '1';
            }
        } catch (err) {
            alert("Błąd połączenia.");
            element.style.opacity = '1';
        }
    }

    // ================== UPLOAD ==================
    function formatStamp(date) {
        return [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, '0'),
            String(date.getDate()).padStart(2, '0')
        ].join('-') + 'T' + [
            String(date.getHours()).padStart(2, '0'),
            String(date.getMinutes()).padStart(2, '0'),
            String(date.getSeconds()).padStart(2, '0')
        ].join('-');
    }

    // Odczyt daty z EXIF (DataTimeOriginal / CreateDate) – tylko dla zdjęć
    async function getPhotoDate(file) {
        if (!file.type.startsWith('image/')) return null;
        if (typeof exifr === 'undefined') return null;
        try {
            const data = await exifr.parse(file, {
                pick: ['DateTimeOriginal', 'CreateDate', 'ModifyDate', 'DateTime']
            });
            if (!data) return null;
            const raw = data.DateTimeOriginal || data.CreateDate || data.ModifyDate || data.DateTime;
            if (!raw) return null;
            const d = raw instanceof Date ? raw : new Date(raw);
            return isNaN(d.getTime()) ? null : d;
        } catch (e) {
            console.warn('EXIF niedostępne dla', file.name, e);
            return null;
        }
    }

    async function uploadSingleFile(file) {
        // Preferuj datę zrobienia zdjęcia (EXIF), inaczej datę wrzucenia
        const photoDate = await getPhotoDate(file);
        const dateForName = photoDate || new Date();
        const stamp = formatStamp(dateForName);

        const safeName = file.name.replace(/[^\w.\-() ]+/g, '_');
        const newName = `${stamp}_${safeName}`;
        const renamed = new File([file], newName, { type: file.type });

        const formData = new FormData();
        formData.append('file', renamed);
        formData.append('path', GALLERY_FOLDER);

        const res = await fetch(`${BACKEND_URL}/upload`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: formData
        });

        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || "Błąd przesyłania");
        }
        return true;
    }

    async function uploadFiles(fileList) {
        const files = Array.from(fileList).filter(f =>
            f.type.startsWith('image/') || f.type.startsWith('video/')
        );

        if (files.length === 0) {
            uploadStatus.textContent = "Wybierz zdjęcia lub filmy";
            uploadStatus.style.color = "red";
            return;
        }

        dropZone.style.pointerEvents = "none";
        dropZone.style.opacity = "0.6";

        let success = 0;
        let failed = 0;

        for (let i = 0; i < files.length; i++) {
            uploadStatus.textContent = `Przesyłanie ${i + 1} z ${files.length}...`;
            uploadStatus.style.color = "#333";
            try {
                await uploadSingleFile(files[i]);
                success++;
            } catch (err) {
                failed++;
                console.error("Błąd uploadu:", files[i].name, err);
            }
        }

        dropZone.style.pointerEvents = "";
        dropZone.style.opacity = "1";

        if (failed === 0) {
            uploadStatus.textContent = files.length === 1 ? "Dodano!" : `Dodano ${success} plików!`;
            uploadStatus.style.color = "green";
        } else {
            uploadStatus.textContent = `Dodano ${success}, błędy: ${failed}`;
            uploadStatus.style.color = "orange";
        }

        setTimeout(() => {
            closeUploadModal();
            loadGallery();
        }, 900);
    }

    function openUploadModal() {
        uploadModal.classList.add('active');
        uploadStatus.textContent = '';
        imageFile.value = '';
    }
    function closeUploadModal() {
        uploadModal.classList.remove('active');
    }

    // Kliknięcie w ramkę → wybór pliku
    dropZone.addEventListener('click', () => imageFile.click());

    // Wybranie plików z dysku
    imageFile.addEventListener('change', () => {
        if (imageFile.files.length > 0) uploadFiles(imageFile.files);
    });

    // Drag & drop wielu plików
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) {
            uploadFiles(e.dataTransfer.files);
        }
    });

    // ================== EVENTY ==================
    loginButton.addEventListener('click', login);
    accessCode.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') login();
    });

    logoutBtn.addEventListener('click', logout);
    addBtn.addEventListener('click', openUploadModal);
    uploadClose.addEventListener('click', closeUploadModal);

    function closeMediaModal() {
        imageModal.classList.remove('active');
        modalImg.src = '';
        modalImg.classList.remove('active');
        modalVideo.pause();
        modalVideo.removeAttribute('src');
        modalVideo.classList.remove('active');
    }
    modalClose.addEventListener('click', closeMediaModal);
    imageModal.addEventListener('click', (e) => {
        if (e.target === imageModal) closeMediaModal();
    });

    // Zamknięcie upload modal kliknięciem w tło
    uploadModal.addEventListener('click', (e) => {
        if (e.target === uploadModal) closeUploadModal();
    });

    // ===== UDOSTĘPNIANIE =====
    shareClose.addEventListener('click', closeShareModal);
    shareModal.addEventListener('click', (e) => {
        if (e.target === shareModal) closeShareModal();
    });

    shareExpiresUnit.addEventListener('change', () => {
        shareExpiresValue.disabled = (shareExpiresUnit.value === 'never');
    });

    generateShareBtn.addEventListener('click', async () => {
        if (!fileToShare) return;

        generateShareBtn.disabled = true;
        generateShareBtn.textContent = "Generowanie...";

        try {
            const res = await fetch(`${BACKEND_URL}/share`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...getAuthHeaders()
                },
                body: JSON.stringify({
                    path: fileToShare,
                    expires_value: parseInt(shareExpiresValue.value) || 1,
                    expires_unit: shareExpiresUnit.value
                })
            });

            if (!res.ok) throw new Error("Błąd generowania linku");

            const data = await res.json();
            shareLinkInput.value = data.link;
            shareResult.classList.add('active');
        } catch (err) {
            alert("Nie udało się wygenerować linku.");
            console.error(err);
        } finally {
            generateShareBtn.disabled = false;
            generateShareBtn.textContent = "Generuj link";
        }
    });

    copyShareBtn.addEventListener('click', () => {
        shareLinkInput.select();
        navigator.clipboard.writeText(shareLinkInput.value).then(() => {
            const original = copyShareBtn.textContent;
            copyShareBtn.textContent = "Skopiowano!";
            setTimeout(() => copyShareBtn.textContent = original, 1500);
        });
    });

    // ================== START ==================
    // Sprawdź czy jest zapisany token (odświeżenie strony)
    const savedToken = sessionStorage.getItem('gallery_token');
    if (savedToken) {
        sessionToken = savedToken;
        loginScreen.style.display = 'none';
        app.style.display = 'block';
        addBtn.style.display = 'block';
        loadGallery();
    } else {
        addBtn.style.display = 'none';
        accessCode.focus();
    }
</script>
</body>
</html>
